spring:
  application:
    name: noban
    version: ${NOBAN_VERSION:latest}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        "[format_sql]": true

jwt:
  private-key: ${JWT_PRIVATE_KEY:classpath:private.pem}
  public-key: ${JWT_PUBLIC_KEY:classpath:public.pem}
  algorithm: ${JWT_ALGORITHM:EC}
  issuer: ${JWT_ISSUER:noban-api}
  access-expiration-time: ${JWT_EXPIRATION_TIME:300000}
  refresh-expiration-time: ${JWT_EXPIRATION_TIME:300000}

cors:
  origin: ${ALLOWED_ORIGIN:http://localhost:8081}
  method: ${ALLOWED_METHOD:GET,POST,PUT,PATCH,DELETE,OPTIONS}
  header: ${ALLOWED_HEADER:Authorization,Content-Type}