spring:
  application:
    name: noban
    version: ${NOBAN_VERSION:latest}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/noban}
    username: ${DATABASE_USERNAME:admin}
    password: ${DATABASE_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        "[format_sql]": true

jwt:
  private-key: ${JWT_PRIVATE_KEY:classpath:private.pem}
  public-key: ${JWT_PUBLIC_KEY:classpath:public.pem}
  algorithm: ${JWT_ALGORITHM:EC}
  issuer: ${JWT_ISSUER:noban-api}
  access-expiration-time: ${JWT_ACCESS_EXPIRATION_TIME:900000}
  refresh-expiration-time: ${JWT_REFRESH_EXPIRATION_TIME:2592000000}
  secure: ${JWT_SECURE:false}

cors:
  origin: ${ORIGIN:http://localhost:8081,http://localhost:5173}
  method: ${METHOD:GET,POST,PUT,PATCH,DELETE,OPTIONS}
  header: ${HEADER:Authorization,Content-Type}